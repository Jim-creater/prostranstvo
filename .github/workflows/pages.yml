# Показ сайта и демо-кабинета на GitHub Pages: https://jim-creater.github.io/prostranstvo/
# Сервер (PHP) на GitHub Pages не работает, поэтому кабинет открывается в демо-режиме на примерных данных.
# Включение: Settings → Pages → Source: GitHub Actions. Публикуется при каждом обновлении ветки main.
name: Показ на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать страницы
        run: |
          mkdir -p _site/docs
          cp -r site/index.html site/privacy.html site/consent.html site/img site/app _site/
          cp docs/*.html _site/docs/
          sed -i "s/demo: false/demo: true/" _site/app/config.js
          grep -q "demo: true" _site/app/config.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
